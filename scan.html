<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Scan Gate — HOLDTIGHT VOL.4</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0d0d;--bone:#E8E4DC;--dim:rgba(232,228,220,.6);--faint:rgba(232,228,220,.35);--line:rgba(232,228,220,.14);--green:#2e9e6b;--red:#c1121f}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--bone);font-family:"Space Mono",monospace;font-size:14px;line-height:1.7;padding:28px 20px;overflow-x:hidden}
.wrap{max-width:460px;margin:0 auto}
h1{font-family:"Anton",sans-serif;font-weight:400;text-transform:uppercase;letter-spacing:.02em;line-height:.95}
.lbl{font-size:10px;letter-spacing:.32em;text-transform:uppercase;color:var(--faint)}
.card{border:1px solid var(--line);padding:26px 22px;margin-top:18px}
.btn{display:inline-block;width:100%;font-family:"Space Mono",monospace;font-weight:700;font-size:12px;letter-spacing:.22em;text-transform:uppercase;padding:14px 26px;text-decoration:none;border:1px solid var(--bone);background:var(--bone);color:#0d0d0d;cursor:pointer}
.btn.green{background:var(--green);border-color:var(--green);color:#fff}
.btn.ghost{background:transparent;color:var(--bone)}
input{background:transparent;border:1px solid var(--line);color:var(--bone);font-family:inherit;font-size:16px;padding:12px}

/* --- fullscreen scanner ala BCA --- */
#scannerOverlay{position:fixed;inset:0;background:#000;z-index:9999;display:none}
#scannerOverlay video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
.scanTopBtn{position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,.45);border:1px solid rgba(232,228,220,.3);color:var(--bone);display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer}
#btnClose{left:14px}
#btnTorch{right:14px}
#btnTorch.on{background:var(--green);border-color:var(--green)}
#scanHintTop{position:absolute;top:calc(env(safe-area-inset-top,0px) + 62px);left:0;right:0;text-align:center;color:var(--bone);font-size:10px;letter-spacing:.28em;text-transform:uppercase;opacity:.85;text-shadow:0 1px 4px rgba(0,0,0,.8)}
#sheet{position:absolute;left:0;right:0;bottom:0;background:var(--bg);border-top-left-radius:18px;border-top-right-radius:18px;padding:18px 20px calc(18px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
#sheet .grip{width:36px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 14px}
#hasilLive{margin-top:14px}
</style>
</head>
<body>
<div class="wrap">
  <div class="lbl">Holdtight Vol.4 — Check-in Gate</div>
  <h1 style="font-size:38px;margin-top:10px">Scan.</h1>

  <div id="needKey" class="card">
    <label class="lbl">kunci panel</label>
    <div style="display:flex;gap:8px;margin-top:10px">
      <input id="keyIn" placeholder="HT4GATE26" style="flex:1">
      <button class="btn" style="width:auto" onclick="simpanKey()">MASUK</button>
    </div>
  </div>

  <div id="scanArea" style="display:none">
    <div class="card" style="text-align:center">
      <button id="btnCam" class="btn green">Buka Kamera — Live Scan</button>
      <p class="lbl" style="margin-top:12px">kamera kebuka fullscreen, arahkan ke qr — otomatis kedetek</p>
    </div>
    <div class="card"><label class="lbl">atau ketik kode manual</label>
      <div style="display:flex;gap:8px;margin-top:10px">
        <input id="manual" placeholder="HT4-7F3A" style="flex:1">
        <button class="btn" style="width:auto" onclick="cek(document.getElementById('manual').value)">CEK</button>
      </div>
    </div>
    <div id="hasil" style="margin-top:18px"></div>
    <p class="lbl" style="margin-top:14px;text-align:center"><a href="#" style="color:var(--faint)" onclick="gantiKey();return false">ganti kunci</a></p>
  </div>
</div>

<!-- fullscreen scanner, ala aplikasi bank (BCA dkk) -->
<div id="scannerOverlay">
  <video id="video" playsinline autoplay muted></video>
  <button id="btnClose" class="scanTopBtn" aria-label="Tutup kamera">✕</button>
  <button id="btnTorch" class="scanTopBtn" aria-label="Senter">🔦</button>
  <div id="scanHintTop">arahkan ke qr — otomatis kedetek</div>
  <div id="sheet">
    <div class="grip"></div>
    <label class="lbl">atau ketik kode manual</label>
    <div style="display:flex;gap:8px;margin-top:10px">
      <input id="manualLive" placeholder="HT4-7F3A" style="flex:1">
      <button class="btn" style="width:auto" onclick="cek(document.getElementById('manualLive').value)">CEK</button>
    </div>
    <div id="hasilLive"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/qr-scanner@1.4.2/qr-scanner.umd.min.js"></script>
<script>
/* GANTI dengan Web App URL Apps Script lo (sama persis dgn TICKET_API di index.html) */
var BASE = 'https://script.google.com/macros/s/AKfycbyN8MaPdlkPP1jNrD0tliTKnCbB1lLDkiG3-c7Gw05ajPdwejzZ3cuAxt8pOj4Q4izw/exec';

var KEY = sessionStorage.getItem('ht4key') || '';
(function(){
  var qs = new URLSearchParams(location.search);
  var qk = qs.get('key');
  if(qk){ KEY = qk; sessionStorage.setItem('ht4key', qk); }
})();
var sibuk=false;

function e2(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}

// tampil hasil di dua tempat sekaligus (panel biasa & sheet di scanner fullscreen), yg relevan aja yg keliatan
function tampil(warna,pesan){
  var html = "<div class=card style='border-color:"+warna+"'><h1 style='font-size:22px;color:"+warna+";line-height:1.4;margin:0'>"+pesan+"</h1></div>";
  var h1 = document.getElementById("hasil"); if(h1) h1.innerHTML = html;
  var h2 = document.getElementById("hasilLive"); if(h2) h2.innerHTML = html;
}

function simpanKey(){
  var v = document.getElementById('keyIn').value.trim();
  if(!v) return;
  KEY = v; sessionStorage.setItem('ht4key', v);
  document.getElementById('needKey').style.display='none';
  document.getElementById('scanArea').style.display='block';
}
function gantiKey(){
  sessionStorage.removeItem('ht4key'); KEY='';
  tutupKamera();
  document.getElementById('scanArea').style.display='none';
  document.getElementById('needKey').style.display='block';
}

function cek(code){
  code=String(code||"").trim().toUpperCase(); if(!code||sibuk) return; sibuk=true;
  tampil("var(--faint)","MEMERIKSA…");
  fetch(BASE,{method:"POST",headers:{"Content-Type":"text/plain"},body:JSON.stringify({action:"checkin",key:KEY,code:code})})
  .then(function(r){return r.json()}).then(function(d){
    if(d.ok){tampil("var(--green)","VALID ✓ — SILAKAN MASUK<br>"+e2(d.nama)+"<br>"+e2(d.code))}
    else if(d.status==="SUDAH_DIPAKE"){tampil("var(--red)","SUDAH DIPAKE ✕<br>"+e2(d.nama)+"<br>"+e2(d.code)+"<br><small>check-in: "+e2(d.waktu)+"</small>")}
    else if(d.status==="BELUM_LUNAS"){tampil("var(--red)","BELUM LUNAS ✕<br>"+e2(d.nama)+"<br>"+e2(d.code))}
    else if(d.error==="forbidden"){tampil("var(--red)","KUNCI SALAH ✕<br><small>cek lagi kunci panel</small>")}
    else{tampil("var(--red)","TIDAK DITEMUKAN ✕<br>"+e2(code))}
    setTimeout(function(){sibuk=false},2500);
  }).catch(function(){tampil("var(--red)","KONEKSI GAGAL — coba lagi");sibuk=false});
}

var video, qrScanner=null, lastResult='', torchOn=false;

function bukaKamera(){
  video=document.getElementById("video");
  if(typeof QrScanner==="undefined"){tampil("var(--red)","LIBRARY QR BELUM TERMUAT — cek internet, lalu refresh");return}

  document.getElementById("scannerOverlay").style.display="block";
  document.body.style.overflow="hidden";

  qrScanner = new QrScanner(video, function(result){
    var text = (result && result.data) || result;
    if(!text || sibuk || text===lastResult) return;
    lastResult = text;
    cek(text);
    setTimeout(function(){ lastResult=''; }, 2600); // biar QR yg sama gak double-trigger pas masih ke-hold
  }, {
    highlightScanRegion: true,
    highlightCodeOutline: true,
    maxScansPerSecond: 10,
    preferredCamera: 'environment',
    returnDetailedScanResult: true
  });

  qrScanner.start().then(function(){
    qrScanner.hasFlash().then(function(has){
      document.getElementById("btnTorch").style.display = has ? "flex" : "none";
    }).catch(function(){ document.getElementById("btnTorch").style.display="none"; });
  }).catch(function(err){
    tutupKamera();
    tampil("var(--red)","GAGAL BUKA KAMERA ✕<br><small>"+e2(err&&err.message||err)+"</small>");
  });
}

function tutupKamera(){
  if(qrScanner){ qrScanner.stop(); qrScanner.destroy(); qrScanner=null; }
  torchOn=false;
  var bt=document.getElementById("btnTorch");
  if(bt){ bt.classList.remove("on"); bt.textContent="🔦"; }
  document.getElementById("scannerOverlay").style.display="none";
  document.body.style.overflow="";
}

function toggleTorch(){
  if(!qrScanner) return;
  torchOn = !torchOn;
  (torchOn ? qrScanner.turnFlashOn() : qrScanner.turnFlashOff()).then(function(){
    var bt=document.getElementById("btnTorch");
    bt.classList.toggle("on", torchOn);
    bt.textContent = torchOn ? "⚡" : "🔦";
  }).catch(function(){});
}

document.addEventListener('DOMContentLoaded',function(){
  document.getElementById('btnCam').addEventListener('click',bukaKamera);
  document.getElementById('btnClose').addEventListener('click',tutupKamera);
  document.getElementById('btnTorch').addEventListener('click',toggleTorch);
  if(KEY){
    document.getElementById('needKey').style.display='none';
    document.getElementById('scanArea').style.display='block';
  }
});
</script>
</body>
</html>
